version: '3.8'

services:
  postgres:
    image: postgres:16-alpine3.24
    container_name: e_commerce_postgres
    restart: always
    environment:
      POSTGRES_DB: e_commerce_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
